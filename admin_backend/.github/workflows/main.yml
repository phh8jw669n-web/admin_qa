name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    concurrency:
      group: backend-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "src/**/*.ts" || true

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: ci
    concurrency:
      group: backend-docker-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t admin-backend:${{ github.sha }} .

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci
    concurrency:
      group: backend-deploy-${{ github.ref }}
      cancel-in-progress: false

    # Deploy only when code is pushed to develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: dist/
          target: ${{ secrets.PROJECT_PATH }}
          overwrite: true

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            echo "Starting deployment..."

            cd "${{ secrets.PROJECT_PATH }}"

            echo "Current directory:"
            pwd

            echo "Pulling latest code..."
            git fetch origin develop
            git reset --hard origin/develop

            echo "Installing production dependencies..."
            npm install --omit=dev --no-audit --no-fund --maxsockets=1

            echo "Checking PM2..."

            # Install PM2 if it is not already installed
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found. Installing PM2..."
              npm install -g pm2
            fi

            # Start application if it doesn't exist,
            # otherwise restart the existing process.
            if pm2 describe admin-backend >/dev/null 2>&1; then
              echo "PM2 process exists. Restarting..."
              pm2 restart admin-backend --update-env
            else
              echo "PM2 process does not exist. Starting..."
              pm2 start dist/main.js --name admin-backend
            fi

            # Save PM2 process list
            pm2 save

            echo "Deployment completed successfully."

            echo "PM2 status:"
            pm2 status
